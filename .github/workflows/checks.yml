# CI is the gate: the one step below runs `pnpm run gate`, the same script the pre-push hook runs
# (INST-GATE: one implementation, three callers), so the list of checks cannot drift from the
# hook's. Inside it, in order: format (skipped until a .prettierrc exists), lint, typecheck, import
# graph, dead code, unit tests with the coverage floor, standards ratchet + changelog over the
# pushed range, secret scan, production build, then the browser suite with its axe scans against
# that build (the e2e script; Chromium and the seeded restaurant are prepared below); a red gate
# names the failing step in its log. Two steps follow that the gate
# cannot run: the coverage of the changed lines (TEST.4: the runner's changed-files mode holds the
# lib/** floor over what this push touched, so an untested new file is red even while the total
# holds) and the audit (its built-in one needs package-lock.json).
# Started from `abatty ci` (next preset), which generates npm steps; hand-maintained since, see
# docs/ADOPTION_DECISIONS.md (2026-09-20 · phase 0).
name: checks
on:
  push:
  pull_request:
concurrency:
  group: checks-${{ github.ref }}
  # A superseded branch run is cancelled; main always gets a verdict (FLOW.2).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
env:
  # Prisma auto-installs @prisma/client (rewriting package.json and the lockfile) when it fails to
  # resolve it. A frozen install must fail loudly instead (SEC-LOCKFILE).
  PRISMA_GENERATE_SKIP_AUTOINSTALL: "true"
  # The build needs these variables to exist; the browser suite needs the database to be real (the
  # postgres service below).
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  NEXTAUTH_URL: http://localhost:3000
  NEXTAUTH_SECRET: ci-only-not-a-secret
  AUTH_TRUST_HOST: "true"
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      # The browser suite needs the seeded restaurant behind the production build (DATABASE_URL above).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the ratchet judges the pushed range from the fork point off origin/main
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: the browser suite's data (the migrations, then the seeded restaurant)
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma db seed
      - name: the range this run judges
        # On a push to main, origin/main already equals HEAD, so the gate's own fork-point logic
        # sees an empty push and skips the build suite; the event carries the real range.
        id: range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            echo "range=origin/${{ github.base_ref }}..HEAD" >> "$GITHUB_OUTPUT"
          elif git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            echo "range=${{ github.event.before }}..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "range=HEAD~1..HEAD" >> "$GITHUB_OUTPUT"
          fi
      - name: "gate: lint, typecheck, import graph, dead code, unit tests, standards ratchet, abatty secrets, build"
        run: pnpm run -s gate -- --range "${{ steps.range.outputs.range }}"
      - name: coverage of the changed lines (TEST.4)
        run: pnpm run -s test:changed
      - name: audit (SEC.1)
        # Last, so a red audit (a registry verdict, not this push's) never skips the steps above.
        run: pnpm audit --prod --audit-level=high
