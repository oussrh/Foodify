# CI is the gate: the one step below runs `pnpm run gate`, the same script the pre-push hook runs
# (INST-GATE: one implementation, three callers), so the list of checks cannot drift from the
# hook's. Inside it, in order: format (skipped until a .prettierrc exists), lint, typecheck, import
# graph, dead code, unit tests with the coverage floor, standards ratchet + changelog over the
# pushed range, secret scan, production build; the database and browser suites join when their
# scripts exist. The audit is its own step because the gate's built-in one needs package-lock.json.
# Started from `abatty ci` (next preset), which generates npm steps; hand-maintained since, see
# docs/ADOPTION_DECISIONS.md (2026-09-20 · phase 0).
name: checks
on:
  push:
  pull_request:
concurrency:
  group: checks-${{ github.ref }}
  # A superseded branch run is cancelled; main always gets a verdict (FLOW.2).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
env:
  # Prisma auto-installs @prisma/client (rewriting package.json and the lockfile) when it fails to
  # resolve it. A frozen install must fail loudly instead (SEC-LOCKFILE).
  PRISMA_GENERATE_SKIP_AUTOINSTALL: "true"
  # The build needs these variables to exist, not to be real: every route is rendered on demand.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  NEXTAUTH_URL: http://localhost:3000
  NEXTAUTH_SECRET: ci-only-not-a-secret
  AUTH_TRUST_HOST: "true"
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the ratchet judges the pushed range from the fork point off origin/main
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: "gate: lint, typecheck, import graph, dead code, unit tests, standards ratchet, abatty secrets, build"
        run: pnpm run -s gate
      - name: audit (SEC.1)
        run: pnpm audit --prod --audit-level=high
